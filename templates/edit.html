{% extends 'base.html' %}

{% block title %}Редагувати позицію — N & V{% endblock %}

{% block content %}
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 style="color: #3e2723; margin-bottom: 20px; text-align: center;">Редагувати позицію меню ✏️</h2>

        {% if error %}
            <div class="alert" style="margin-bottom: 20px; padding: 10px; background: #ffebee; color: #c62828; border-radius: 6px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Назва:</label>
                <input type="text" name="title" value="{{ item.title }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Категорія:</label>
                <input type="text" name="category" value="{{ item.category_name }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Ціна (₴):</label>
                <input type="number" step="0.01" name="price" value="{{ item.price }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600;">Опис:</label>
                <textarea name="description" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">{{ item.description }}</textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button type="submit" class="btn">Зберегти зміни</button>
                <a href="/items" class="btn" style="background: #a1887f;">Скасувати</a>
            </div>
        </form>
    </div>
{% endblock %}
